services:
  web:
    image: ghcr.io/${GHCR_OWNER}/myapp-web:${IMAGE_TAG:-latest}
    ports:
      - "80:80"
    depends_on:
      - app
    restart: unless-stopped

  app:
    image: ghcr.io/${GHCR_OWNER}/myapp-app:${IMAGE_TAG:-latest}
    env_file: ./backend.env          # file .env Laravel production, tạo thủ công trên server
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  queue:
    image: ghcr.io/${GHCR_OWNER}/myapp-app:${IMAGE_TAG:-latest}
    command: php artisan queue:work --tries=3 --max-time=3600
    env_file: ./backend.env
    depends_on:
      - app
    restart: unless-stopped

  scheduler:
    image: ghcr.io/${GHCR_OWNER}/myapp-app:${IMAGE_TAG:-latest}
    command: php artisan schedule:work
    env_file: ./backend.env
    depends_on:
      - app
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      retries: 10
    restart: unless-stopped        # không mở port 3306 ra ngoài

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data: